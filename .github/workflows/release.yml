name: Release

on:
  push:
    tags: ["v*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  publish:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/umbrel-zerotier-web:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/umbrel-zerotier-web:latest

      - name: Summary
        run: |
          {
            echo "## Released"
            echo ""
            echo "Image: \`ghcr.io/${{ github.repository_owner }}/umbrel-zerotier-web:${{ steps.v.outputs.version }}\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Paste into the umbrel-apps fork's \`zerotier/docker-compose.yml\`:"
            echo ""
            echo "    image: ghcr.io/${{ github.repository_owner }}/umbrel-zerotier-web:${{ steps.v.outputs.version }}@${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
